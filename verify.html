<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Verifying your letter — SEALED</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Instrument+Serif:ital,wght@0,400;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --paper:      #fefcf8;
    --ink:        #000;
    --ink-70:     rgba(0,0,0,0.70);
    --ink-50:     rgba(0,0,0,0.50);
    --ink-35:     rgba(0,0,0,0.35);
    --ink-20:     rgba(0,0,0,0.20);
    --ink-10:     rgba(0,0,0,0.10);
    --ink-06:     rgba(0,0,0,0.06);
    --font-sans:  "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
    --font-serif: "Instrument Serif", Georgia, serif;
    --font-mono:  "Space Mono", ui-monospace, monospace;
    --shell:      1180px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; cursor: pointer; }

  /* Paper grain */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 100;
    background-image:
      radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.018) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 1px;
    mix-blend-mode: multiply; opacity: 0.6;
  }

  /* ─── Nav ─────────────────────────────────────────────────── */
  nav.top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 60;
    padding: 16px 28px;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(254,252,248,0.82);
    backdrop-filter: blur(10px) saturate(120%);
    border-bottom: 1px solid var(--ink-06);
  }
  nav.top .mark {
    font-family: var(--font-serif); font-weight: 500;
    font-size: 20px; letter-spacing: 0.12em;
  }
  .btn-back {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-weight: 700;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em;
    padding: 9px 18px; border-radius: 999px;
    background: var(--ink); color: #fff;
    border: none; transition: opacity 0.18s;
    text-decoration: none;
  }
  .btn-back:hover { opacity: 0.78; }

  /* ─── Verify layout ────────────────────────────────────────── */
  .verify-page {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 160px 28px 80px;
  }
  .verify-wrap {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .verify-icon {
    font-family: var(--font-serif);
    font-size: 64px;
    color: var(--ink-35);
    margin-bottom: 24px;
    line-height: 1;
    display: block;
  }
  .verify-mono {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-35);
    margin-bottom: 12px;
  }
  .verify-title {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: clamp(32px, 5vw, 56px);
    line-height: 1.1;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }
  .verify-title em { font-style: italic; }
  .verify-sub {
    font-family: var(--font-sans);
    font-size: 16px;
    color: var(--ink-70);
    line-height: 1.65;
    margin: 0 auto 32px;
    max-width: 380px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50%       { opacity: 1; }
  }
  .verify-loading {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-35);
    animation: pulse 2s ease-in-out infinite;
  }
  .verify-cta {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-weight: 700;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em;
    padding: 9px 18px; border-radius: 999px;
    background: var(--ink); color: #fff;
    border: none; transition: opacity 0.18s;
    text-decoration: none;
    margin-top: 8px;
  }
  .verify-cta:hover { opacity: 0.78; }

  /* ─── Footer ───────────────────────────────────────────────── */
  footer.foot {
    padding: 80px 28px 40px;
    background: #000; color: #fff;
    position: relative; overflow: hidden;
  }
  footer.foot::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  }
  .foot-inner {
    max-width: var(--shell); margin: 0 auto;
    display: grid; gap: 56px; grid-template-columns: 1fr;
  }
  @media (min-width: 640px)  { .foot-inner { grid-template-columns: 1fr 1fr; gap: 48px; } }
  @media (min-width: 1040px) { .foot-inner { grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 48px; } }
  .foot-brand .mark {
    font-family: var(--font-serif); font-weight: 400;
    font-size: 56px; letter-spacing: -0.02em; line-height: 0.9; margin-bottom: 16px;
  }
  .foot-brand .tag {
    font-family: var(--font-serif); font-style: italic;
    font-size: 17px; color: rgba(255,255,255,0.55);
    max-width: 280px; line-height: 1.5; margin-bottom: 24px;
  }
  .foot-col h4 {
    font-family: var(--font-mono); font-weight: 700;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em;
    color: rgba(255,255,255,0.4); margin: 0 0 20px;
  }
  .foot-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .foot-col a {
    font-family: var(--font-serif); font-size: 17px;
    color: rgba(255,255,255,0.85);
    transition: opacity 0.2s, transform 0.2s; display: inline-block;
  }
  .foot-col a:hover { opacity: 0.6; transform: translateX(2px); }
  .social-list { flex-direction: row !important; gap: 16px !important; }
  .social-list a {
    width: 44px; height: 44px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.85);
    transition: background 0.2s, color 0.2s, transform 0.2s, border-color 0.2s;
  }
  .social-list a:hover { background: #fff; color: #000; border-color: #fff; transform: translateY(-2px); }
  .foot-bottom {
    max-width: var(--shell); margin: 56px auto 0;
    padding-top: 28px; border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: space-between;
    font-family: var(--font-mono); font-weight: 700;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em;
    color: rgba(255,255,255,0.3); text-align: center;
  }
  @media (min-width: 640px) { .foot-bottom { flex-direction: row; text-align: left; } }
</style>
</head>
<body>

<nav class="top">
  <a href="/" class="mark">SEALED</a>
  <a href="/" class="btn-back">← Home</a>
</nav>

<div class="verify-page">
  <div class="verify-wrap" id="verify-content">
    <!-- Loading state — replaced by script -->
    <span class="verify-icon">✦</span>
    <div class="verify-mono">SEALED</div>
    <h1 class="verify-title">Verifying <em>your letter…</em></h1>
    <p class="verify-loading">One moment</p>
  </div>
</div>

<footer class="foot">
  <div class="foot-inner">
    <div class="foot-brand">
      <div class="mark">SEALED</div>
      <div class="tag">Some letters are worth waiting for.</div>
    </div>
    <div class="foot-col">
      <h4>Discover</h4>
      <ul>
        <li><a href="/#waitlist">Join the waitlist</a></li>
        <li><a href="/#first-letter">Write a letter</a></li>
      </ul>
    </div>
    <div class="foot-col">
      <h4>Connect</h4>
      <ul class="social-list">
        <li><a href="#" aria-label="Instagram" title="Instagram">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        </a></li>
        <li><a href="#" aria-label="X" title="X">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2H21l-6.52 7.452L22 22h-6.828l-4.77-6.231L4.8 22H2l7.02-8.024L2 2h6.914l4.32 5.713L18.244 2zm-1.197 18h1.84L7.06 4H5.117l11.93 16z"/></svg>
        </a></li>
        <li><a href="mailto:hello@sealedapp.io" aria-label="Email" title="hello@sealedapp.io">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3,7 12,13 21,7"/></svg>
        </a></li>
      </ul>
    </div>
    <div class="foot-col">
      <h4>Legal</h4>
      <ul>
        <li><a href="/privacy.html">Privacy Policy</a></li>
        <li><a href="/terms.html">Terms of Service</a></li>
      </ul>
    </div>
  </div>
  <div class="foot-bottom">
    <span>© 2026 SEALED · All rights reserved</span>
  </div>
</footer>

<script>
  const SUPABASE_URL = '%VITE_SUPABASE_URL%';
  const SUPABASE_ANON_KEY = '%VITE_SUPABASE_ANON_KEY%';

  var states = {
    sealed: {
      icon: '✦',
      mono: 'SEALED',
      title: 'Your letter is <em>sealed.</em>',
      sub: "We'll deliver it on January 1, 2027. Until then, it's safe with us.",
      cta: null
    },
    already_sealed: {
      icon: '✦',
      mono: 'SEALED',
      title: 'Already <em>sealed.</em>',
      sub: 'Your letter is on its way to January 1, 2027. No further action needed.',
      cta: null
    },
    expired: {
      icon: '○',
      mono: 'EXPIRED',
      title: 'This link <em>expired.</em>',
      sub: 'Verification links are valid for 7 days. Sign up again to get a fresh link.',
      cta: { href: '/', label: 'Return home' }
    },
    invalid: {
      icon: '○',
      mono: 'INVALID',
      title: 'Invalid <em>link.</em>',
      sub: "This verification link isn't valid. If you think this is an error, try returning to the landing page.",
      cta: { href: '/', label: 'Return home' }
    }
  };

  function renderState(name) {
    var s = states[name] || states.invalid;
    var ctaHtml = s.cta
      ? '<a href="' + s.cta.href + '" class="verify-cta">' + s.cta.label + '</a>'
      : '';
    document.getElementById('verify-content').innerHTML =
      '<span class="verify-icon">' + s.icon + '</span>' +
      '<div class="verify-mono">' + s.mono + '</div>' +
      '<h1 class="verify-title">' + s.title + '</h1>' +
      '<p class="verify-sub">' + s.sub + '</p>' +
      ctaHtml;
  }

  (function () {
    var token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      renderState('invalid');
      return;
    }

    fetch(SUPABASE_URL + '/functions/v1/verify-email', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ token: token })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var state = data && data.state ? data.state : 'invalid';
      console.log('[verify]', { state: state });
      renderState(state);
    })
    .catch(function () {
      renderState('invalid');
    });
  })();
</script>

</body>
</html>
